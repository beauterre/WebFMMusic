<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergent Harmony Engine</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; color: #e0e0e0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; 
        }
        .card { 
            background: #16213e; padding: 40px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; 
            border: 1px solid #0f3460; 
        }
        h1 { color: #4ecca3; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        button { 
            padding: 15px 30px; font-size: 18px; cursor: pointer; 
            background: #4ecca3; border: none; color: #1a1a2e; 
            border-radius: 10px; font-weight: bold; transition: 0.3s; 
        }
        button:hover { background: #45b393; transform: scale(1.05); }
        #status { margin-top: 20px; font-family: monospace; color: #4ecca3; }
    </style>

    <!-- YOUR INSTRUMENTARIUM -->
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/FeltPiano/FeltPiano.js"></script>
</head>
<body>

    <div class="card">
        <h1>Emergent Harmony</h1>
        <p>Acoustic Physics-based Generative Music</p>
        <button id="startBtn">Begin Evolution</button>
        <div id="status">System: Idle</div>
    </div>

    <script>
        // The Engine that drives the harmony
        class EmergentHarmony {
            constructor(audioContext) {
                this.audioContext = audioContext;
                // Uses your existing FeltPiano class
                this.instrument = new FeltPiano(audioContext);
                
                this.activeNotes = []; 
                this.maxNotes = 4;
                
                this.roles = {
                    bass: { min: 36, max: 48, chance: 0.1 },
                    harmony: { min: 48, max: 64, chance: 0.3 },
                    melody: { min: 64, max: 84, chance: 0.6 }
                };
            }

            findBestNextNote(role) {
                const roleCfg = this.roles[role];
                const candidates = [];
                for (let i = 0; i < 10; i++) {
                    candidates.push(Math.floor(Math.random() * (roleCfg.max - roleCfg.min + 1)) + roleCfg.min);
                }

                let bestNote = candidates[0];
                let lowestAverageRatioDiff = Infinity;

                candidates.forEach(candidateMidi => {
                    const candidateFreq = Instrument.midiToFrequency(candidateMidi);
                    let totalRatioError = 0;

                    this.activeNotes.forEach(active => {
                        const ratio = candidateFreq / active.freq;
                        const simpleRatios = [1, 1.25, 1.33, 1.5, 1.66, 2, 2.5, 3];
                        let minError = Infinity;
                        simpleRatios.forEach(sr => {
                            const error = Math.abs(ratio - sr);
                            if (error < minError) minError = error;
                        });
                        totalRatioError += minError;
                    });

                    if (totalRatioError < lowestAverageRatioDiff) {
                        lowestAverageRatioDiff = totalRatioError;
                        bestNote = candidateMidi;
                    }
                });
                return bestNote;
            }

            playStep(step) {
                const now = this.audioContext.currentTime;
                this.activeNotes = this.activeNotes.filter(n => now < n.startTime + n.duration);

                const divisions = [3, 4, 6, 8];
                const activeDivisions = divisions.filter(d => step % d === 0);
                
                if (activeDivisions.length > 0) {
                    const roll = Math.random();
                    let chosenRole = 'melody';
                    if (roll < 0.1) chosenRole = 'bass';
                    else if (roll < 0.4) chosenRole = 'harmony';

                    if (this.activeNotes.length >= this.maxNotes) {
                        this.activeNotes.shift(); 
                    }

                    const nextMidi = this.findBestNextNote(chosenRole);
                    const duration = chosenRole === 'bass' ? 6000 : (chosenRole === 'harmony' ? 4000 : 2000);
                    
                    this.instrument.play(nextMidi, 0.4, duration);
                    
                    this.activeNotes.push({
                        midi: nextMidi,
                        freq: Instrument.midiToFrequency(nextMidi),
                        startTime: now,
                        duration: duration / 1000
                    });
                    return chosenRole;
                }
                return null;
            }
        }

        // UI Logic
        let audioContext;
        let engine;

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                engine = new EmergentHarmony(audioContext);
            }

            document.getElementById('startBtn').style.display = 'none';
            
            let step = 0;
            setInterval(() => {
                const role = engine.playStep(step);
                if (role) {
                    document.getElementById('status').innerText = `Playing: role∣Step:{role} | Step:role∣Step:{step}`;
                }
                step++;
            }, 250);
        });
    </script>
</body>
</html>
