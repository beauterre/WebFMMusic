<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergent Glass - Cellular Phase</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a12; color: #d1d1e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #161625; padding: 40px; border-radius: 30px; border: 1px solid #2a2a4a; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { font-weight: 300; letter-spacing: 4px; color: #b8c0ff; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-style: italic; }
        button { padding: 20px 40px; cursor: pointer; background: #b8c0ff; border: none; border-radius: 50px; font-weight: bold; color: #0a0a12; font-size: 1.2em; transition: 0.3s; }
        button:hover { background: #fff; transform: scale(1.05); }
        #status { margin-top: 30px; font-family: monospace; color: #555; font-size: 0.9em; }
    </style>
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/FeltPiano/FeltPiano.js"></script>
</head>
<body>
    <div class="container">
        <h1>CELLULAR GLASS</h1>
        <p>Phasing Modules with Emergent Evolution</p>
        <button id="startBtn">Begin Composition</button>
        <div id="status">Silence...</div>
    </div>

    <script>
        let ctx, inst, activeNotes = [];
        let isPlaying = false;
        let globalStep = 0;
        let currentRoot = 48;

        function sRandom(seed) {
            var x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function getConsonanceScore(freq1, freq2) {
            const ratio = freq1 / freq2;
            let bestError = Infinity;
            for (let n = 1; n <= 12; n++) {
                for (let d = 1; d <= 12; d++) {
                    const simpleRatio = n / d;
                    const error = Math.abs(ratio - simpleRatio);
                    if (error < bestError) bestError = error;
                }
            }
            return bestError;
        }

        function findConsonantNote(role, root) {
            const roles = {
                bass: { min: 36, max: 48 },
                mid: { min: 48, max: 72 },
                high: { min: 60, max: 84 }
            };
            const cfg = roles[role];
            const rootFreq = Instrument.midiToFrequency(root);
            
            let bestNote = 60, lowestScore = Infinity;
            // We search a small window to find a strong anchor
            for (let i = 0; i < 50; i++) {
                const candidate = Math.floor(Math.random() * (cfg.max - cfg.min + 1)) + cfg.min;
                const candidateFreq = Instrument.midiToFrequency(candidate);
                
                let score = getConsonanceScore(candidateFreq, rootFreq);
                
                // Penalty for exact octaves to encourage 3rds/5ths
                if (score < 0.001) score += 0.02;

                if (score < lowestScore) {
                    lowestScore = score;
                    bestNote = candidate;
                }
            }
            return bestNote;
        }

        class Layer {
            constructor(role, cycleLength, volume, duration) {
                this.role = role;
                this.cycleLength = cycleLength; // 3, 4, 5, 6 etc.
                this.volume = volume;
                this.duration = duration;
                this.cell = [];
                this.initCell();
            }

            initCell() {
                this.cell = [];
                for (let i = 0; i < this.cycleLength; i++) {
                    this.cell.push(findConsonantNote(this.role, currentRoot));
                }
            }

            // Check if the current cell is still "happy" with the global harmony
            evolve(globalRoot) {
                const rootFreq = Instrument.midiToFrequency(globalRoot);
                this.cell.forEach((note, idx) => {
                    const noteFreq = Instrument.midiToFrequency(note);
                    const dissonance = getConsonanceScore(noteFreq, rootFreq);
                    
                    // If the note has become too dissonant (threshold 0.05), regenerate it
                    if (dissonance > 0.05) {
                        this.cell[idx] = findConsonantNote(this.role, globalRoot);
                    }
                });
            }

            play(step, now) {
                const noteIdx = step % this.cycleLength;
                const note = this.cell[noteIdx];
                
                inst.play(note, this.volume, 4000);
                activeNotes.push({ 
                    freq: Instrument.midiToFrequency(note), 
                    startTime: now, 
                    duration: this.duration 
                });
            }
        }

        async function startEngine() {
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                inst = new FeltPiano(ctx);
            }

            isPlaying = true;
            
            // Create 3 phased layers with different prime-ish cycle lengths
            const layers = [
                new Layer('bass', 8, 0.4, 4),
                new Layer('mid', 5, 0.2, 2),
                new Layer('high', 7, 0.15, 1)
            ];

            setInterval(() => {
                if (!isPlaying) return;
                const now = ctx.currentTime;
                activeNotes = activeNotes.filter(n => now < n.startTime + n.duration);

                // 1. Occasional Harmonic Shift
                if (globalStep % 64 === 0 && globalStep !== 0) {
                    currentRoot += (Math.random() > 0.5 ? 2 : -2);
                    if (currentRoot < 36 || currentRoot > 60) currentRoot = 48;
                    
                    // Tell layers to check if their cells need to evolve
                    layers.forEach(l => l.evolve(currentRoot));
                }

                // 2. Play the Cells
                layers.forEach(layer => {
                    // Bass plays every 4, Mid every 2, High every 1 for rhythmic contrast
                    const rhythmDivisor = layer.role === 'bass' ? 4 : layer.role === 'mid' ? 2 : 1;
                    if (globalStep % rhythmDivisor === 0) {
                        layer.play(globalStep, now);
                    }
                });

                document.getElementById('status').innerText = `Root: currentRoot∣Step:{currentRoot} | Step:currentRoot∣Step:{globalStep} | Phasing Cells: 8, 5, 7`;
                globalStep++;
            }, 200);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            startEngine();
            document.getElementById('startBtn').innerText = "Composition Running...";
            document.getElementById('startBtn').disabled = true;
        });
    </script>
</body>
</html>
