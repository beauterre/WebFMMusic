<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zen Atmosphere - DNA Extension</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            background: #08080c; 
            color: #a0a0b0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            max-width: 600px; 
            padding: 60px; 
            border-radius: 40px; 
            background: rgba(255,255,255,0.01); 
            border: 1px solid rgba(255,255,255,0.03); 
        }
        h1 { 
            color: #d1d1ff; 
            font-weight: lighter; 
            font-style: italic; 
            letter-spacing: 4px;
        }
        .status-box { 
            margin: 30px 0; 
            padding: 20px; 
            background: rgba(0,0,0,0.6); 
            border-radius: 20px; 
            font-family: 'Courier New', monospace; 
            color: #8aaaff; 
            text-align: center; 
            font-size: 0.9em; 
            border: 1px solid rgba(192, 192, 255, 0.1); 
            min-height: 60px;
            line-height: 1.5;
        }
        #startBtn { 
            padding: 15px 40px; 
            cursor: pointer; 
            background: transparent; 
            border: 1px solid #d1d1ff; 
            color: #d1d1ff; 
            border-radius: 50px; 
            font-family: 'Georgia', serif; 
            transition: all 0.4s ease; 
        }
        #startBtn:hover { 
            background: #d1d1ff; 
            color: #0a0a0f; 
        }
    </style>
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/SereneBells/SereneBells.js"></script>
    <script src="../../general/EffectManager.js"></script>
</head>
<body>

    <div class="container">
        <h1>DNA Extension</h1>
        <p style="color: #555; font-style: italic;">An endless mirror of the provided notation</p>
        <div class="status-box" id="debug">Waiting for the seed...</div>
        <button id="startBtn">Awaken the Echo</button>
    </div>

    <script>
        let audioContext;
        let bellInst;
        let effectMgr;

        // DNA EXTRACTED FROM ABC
        // Lows: Anchors | Mids: Harmonic connective tissue | Highs: Fragile peaks
        const DNA = {
            anchors: [37, 41, 45, 49], // C#,, D,, E,, A,
            harmonics: [53, 56, 61, 64, 68], // F#, G#, C#, E, A
            peaks: [73, 76, 81, 84, 89], // A', C#', E', A'', B''
            
            // Rhythmic markers extracted from ABC (e.g., 2.16s, 10.35s, 29.87s)
            temporalMarkers: [2.1, 5.3, 8.2, 12.8, 20.0]
        };

        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            effectMgr = new EffectManager(audioContext);
            bellInst = new SereneBells(audioContext);
            bellInst.setVolume(1.3);
            effectMgr.setReverb(bellInst, 'cathedral');
        }

        function sRandom(min, max) {
            return Math.random() * (max - min) + min;
        }

        // PHRASE 1: The Heavy Breath (Bass Logic)
        function playAnchor() {
            const note = DNA.anchors[Math.floor(Math.random() * DNA.anchors.length)];
            document.getElementById('debug').innerHTML = "Phrasing: The Heavy Breath<br>Root: " + note;
            bellInst.play(note, 0.2, 18000);
        }

        // PHRASE 2: The Flutter (Melodic Logic - derived from G#/B/E movements)
        function playFlutter() {
            document.getElementById('debug').innerHTML = "Phrasing: The Fragile Flutter<br>Logic: Harmonic Oscillation";
            const count = Math.floor(sRandom(3, 6));
            for (let i = 0; i < count; i++) {
                setTimeout(function() {
                    const note = DNA.harmonics[Math.floor(Math.random() * DNA.harmonics.length)];
                    bellInst.play(note, 0.08, 8000);
                }, i * sRandom(800, 1500));
            }
        }

        // PHRASE 3: The High Ghost (Peak Logic - derived from A''/B'' leaps)
        function playPeak() {
            document.getElementById('debug').innerHTML = "Phrasing: The High Ghost<br>Logic: Ethereal Leap";
            const note = DNA.peaks[Math.floor(Math.random() * DNA.peaks.length)];
            bellInst.play(note, 0.05, 12000);
        }

        // PHRASE 4: The Swell (Combined Logic)
        function playSwell() {
            document.getElementById('debug').innerHTML = "Phrasing: The Harmonic Swell<br>Logic: Layered Arrival";
            const root = DNA.anchors[Math.floor(Math.random() * DNA.anchors.length)];
            const mid = DNA.harmonics[Math.floor(Math.random() * DNA.harmonics.length)];
            const peak = DNA.peaks[Math.floor(Math.random() * DNA.peaks.length)];
            
            bellInst.play(root, 0.1, 15000);
            setTimeout(function() { bellInst.play(mid, 0.08, 12000); }, 500);
            setTimeout(function() { bellInst.play(peak, 0.05, 10000); }, 1000);
        }

        function engine() {
            const roll = Math.random();
            let nextInterval = sRandom(6000, 15000);

            if (roll < 0.4) {
                playAnchor();
                nextInterval = sRandom(12000, 25000); // Bass needs more space
            } else if (roll < 0.7) {
                playFlutter();
            } else if (roll < 0.9) {
                playPeak();
            } else {
                playSwell();
            }

            setTimeout(engine, nextInterval);
        }

        document.getElementById('startBtn').addEventListener('click', async function() {
            await initAudio();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('debug').innerHTML = "Extrapolating ABC DNA...";
            
            setTimeout(engine, 3000);
        });
    </script>
</body>
</html>
