<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grand Modal Improviser</title>
    <style>
        body { font-family: 'Georgia', serif; background: #050508; color: #8a8aa0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; width: 80%; max-width: 800px; padding: 40px; border-radius: 40px; background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.03); }
        h1 { color: #d1d1ff; font-weight: lighter; font-style: italic; letter-spacing: 4px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input { background: rgba(0,0,0,0.5); color: #8aaaff; border: 1px solid rgba(192, 192, 255, 0.2); border-radius: 10px; padding: 10px; font-family: 'Courier New', monospace; text-align: center; }
        .status-box { margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.6); border-radius: 20px; font-family: 'Courier New', monospace; color: #8aaaff; text-align: center; font-size: 0.9em; border: 1px solid rgba(192, 192, 255, 0.1); min-height: 60px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 25px; cursor: pointer; background: transparent; border: 1px solid #d1d1ff; color: #d1d1ff; border-radius: 50px; font-family: 'Georgia', serif; transition: all 0.4s ease; }
        button:hover { background: #d1d1ff; color: #0a0a0f; }
        .secondary { border-color: #8aaaff; color: #8aaaff; }
    </style>
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/FeltPiano/FeltPiano.js"></script>
    <script src="../../general/EffectManager.js"></script>
</head>
<body>

    <div class="container">
        <h1>Grand Modal Improviser</h1>
        
        <div class="controls">
            <div>
                <label>Seed</label><br>
                <input type="text" id="seedInput" value="DeepSymmetry">
            </div>
            <div class="btn-group" style="align-items: end;">
                <button id="playBtn">Play</button>
                <button id="stopBtn">Stop</button>
            </div>
        </div>

        <div class="status-box" id="debug">Ready for Expanded Map...</div>
        
        <div class="btn-group">
            <button id="exportBtn" class="secondary">Export ABC</button>
        </div>
    </div>

    <script>
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
        }
        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
                var t = (a + b | 0) + d | 0;
                d = d + 1 | 0;
                a = b ^ b >>> 9;
                b = c + (c << 3) | 0;
                c = (c << 21 | c >>> 11);
                c = c + t | 0;
                return (t >>> 0) / 4294967296;
            }
        }

        let rand = Math.random;
        function setSeed(seed) {
            const seedData = cyrb128(seed);
            rand = sfc32(seedData[0], seedData[1], seedData[2], seedData[3]);
        }

        const WEIGHTS = { CORE: 1.0, COLOR: 0.1, TENSION: 0.01, FORBIDDEN: 0.0 };

        class MarkovChord {
            constructor(name, bass, weights, transitions) {
                this.name = name;
                this.bass = bass;
                this.weights = weights; 
                this.transitions = transitions;
            }

            getNext() {
                const r = rand();
                let cumulative = 0;
                for (let chordName in this.transitions) {
                    cumulative += this.transitions[chordName];
                    if (r <= cumulative) return chordName;
                }
                return Object.keys(this.transitions)[0];
            }

            getCoreNotes() {
                let core = [];
                for (let i = 0; i < 12; i++) {
                    if (this.weights[i] === WEIGHTS.CORE) core.push(i);
                }
                return core;
            }

            getWeightedNote(tensionLevel) {
                let pool = [];
                for (let i = 0; i < 12; i++) {
                    let weight = this.weights[i];
                    if (weight === WEIGHTS.TENSION) weight *= (tensionLevel * 10); 
                    if (weight === WEIGHTS.COLOR) weight *= (1 + tensionLevel);
                    for (let w = 0; w < weight * 100; w++) pool.push(i);
                }
                return pool.length > 0 ? pool[Math.floor(rand() * pool.length)] : 0;
            }

            resolveNote(originalNoteOffset) {
                let bestNote = 0;
                let minDistance = 13;
                for (let i = 0; i < 12; i++) {
                    if (this.weights[i] >= WEIGHTS.COLOR) {
                        let dist = Math.abs(i - originalNoteOffset);
                        if (dist > 6) dist = 12 - dist;
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestNote = i;
                        }
                    }
                }
                return bestNote;
            }
        }

        // ==========================================
        // Sati Gymnopedie based CHORD_MAP
        // ==========================================
        const CHORD_MAP = {
            // The "Home" chord - D Major / B Minor feel
            "Dmaj7": new MarkovChord("Dmaj7", 38, [
                WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.FORBIDDEN, 
                WEIGHTS.COLOR, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, 
                WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.COLOR
            ], { "Dmaj7": 0.3, "Amaj7": 0.4, "Gmaj7": 0.2, "Em7": 0.1 }),

            // The "Pivot" - A Major / F# Minor feel
            "Amaj7": new MarkovChord("Amaj7", 45, [
                WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.TENSION, 
                WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.COLOR, WEIGHTS.TENSION, 
                WEIGHTS.CORE, WEIGHTS.FORBIDDEN, WEIGHTS.COLOR, WEIGHTS.CORE
            ], { "Amaj7": 0.3, "Dmaj7": 0.4, "Gmaj7": 0.2, "Cmaj7": 0.1 }),

            // The "Lift" - G Major
            "Gmaj7": new MarkovChord("Gmaj7", 43, [
                WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.TENSION, WEIGHTS.TENSION, 
                WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, 
                WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.CORE
            ], { "Gmaj7": 0.3, "Dmaj7": 0.4, "Cmaj7": 0.2, "Amaj7": 0.1 }),

            // The "Depth" - E Minor / C Major lean
            "Em7": new MarkovChord("Em7", 40, [
                WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.CORE, WEIGHTS.TENSION, 
                WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.TENSION, WEIGHTS.TENSION, 
                WEIGHTS.COLOR, WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.CORE
            ], { "Em7": 0.3, "Amaj7": 0.5, "Dmaj7": 0.2 }),

            // The "Resolution" - C Major
            "Cmaj7": new MarkovChord("Cmaj7", 48, [
                WEIGHTS.CORE, WEIGHTS.FORBIDDEN, WEIGHTS.CORE, WEIGHTS.TENSION, 
                WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.COLOR, WEIGHTS.CORE, 
                WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.COLOR
            ], { "Cmaj7": 0.3, "Gmaj7": 0.4, "Dmaj7": 0.2, "Fmaj7": 0.1 }),

            // The "Sub" - F Major (appears in your latter half)
            "Fmaj7": new MarkovChord("Fmaj7", 41, [
                WEIGHTS.CORE, WEIGHTS.FORBIDDEN, WEIGHTS.TENSION, WEIGHTS.TENSION, 
                WEIGHTS.CORE, WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.COLOR, 
                WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE
            ], { "Fmaj7": 0.3, "Cmaj7": 0.5, "Gmaj7": 0.2 }),
        };
        // ==========================================

        let audioContext, pianoInst, effectMgr;
        let isPlaying = false;
        let currentChordName = "C2";
        let phraseLibrary = []; 
        const MAX_MEMORY = 5;

        async function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                effectMgr = new EffectManager(audioContext);
                pianoInst = new FeltPiano(audioContext);
                pianoInst.setVolume(1.1);
                effectMgr.setReverb(pianoInst, 'room');
            }
            if (audioContext.state === 'suspended') await audioContext.resume();
        }

                    async function improvise() {
            if (!isPlaying) return;

            const debug = document.getElementById('debug');
            
            if (!CHORD_MAP[currentChordName]) {
                currentChordName = Object.keys(CHORD_MAP)[0];
            }

            const chord = CHORD_MAP[currentChordName];
            const coreNotes = chord.getCoreNotes(); // [Root, 3rd, 5th, 7th]
            const arpeggioTiming = 300;

            // --- IMPROVED ASCENT (Harmonic Shaping) ---
            
            // 1. The Anchor: Deep Root
            pianoInst.play(chord.bass, 0.2, 4000);
            await new Promise(r => setTimeout(r, arpeggioTiming));

            // 2. The Shell: Root (octave up) and 5th
            // We prioritize the 5th over the 3rd here to create a "hollow" professional space
            pianoInst.play(chord.bass + 12, 0.15, 3000);
            await new Promise(r => setTimeout(r, arpeggioTiming));
            
            if (coreNotes.length >= 3) {
                // Play the 5th (index 2 in a standard Root-3-5-7 map)
                pianoInst.play(60 + coreNotes[2] + 12, 0.1, 3000);
                await new Promise(r => setTimeout(r, arpeggioTiming));
            }

            // 3. The Shimmer: 7th and 3rd (The "Major 7" character)
            // We play the 7th then the 3rd. This "caps" the chord and defines the Maj7 feel.
            if (coreNotes.length >= 4) {
                // Play the 7th (index 3)
                pianoInst.play(60 + coreNotes[3] + 12, 0.1, 2000);
                await new Promise(r => setTimeout(r, arpeggioTiming * 0.8));
                // Play the 3rd (index 1) - this creates the lush resolution
                pianoInst.play(60 + coreNotes[1] + 12, 0.1, 2000);
                await new Promise(r => setTimeout(r, arpeggioTiming * 0.8));
            } else if (coreNotes.length > 0) {
                // Fallback for smaller chords
                for(let i = 1; i < coreNotes.length; i++) {
                    pianoInst.play(60 + coreNotes[i] + 12, 0.1, 2000);
                    await new Promise(r => setTimeout(r, arpeggioTiming * 0.8));
                }
            }

            // --- THE PEAK (Melody Phrase) ---
            const actionRoll = rand();
            let action = "innovate";
            if (actionRoll < 0.15) action = "silence";
            else if (actionRoll < 0.45 && phraseLibrary.length > 0) action = "recall"; 
            else if (actionRoll < 0.70 && phraseLibrary.length > 0) action = "evolve";
            else action = "innovate";

            if (action === "silence") {
                debug.innerHTML = "Chord: " + chord.name + " | Breath...";
                await new Promise(r => setTimeout(r, 1500));
            } 
            else if (action === "innovate") {
                debug.innerHTML = "Chord: " + chord.name + " | Innovating peak...";
                let newPhrase = { notes: [], durs: [] };
                const len = Math.floor(rand() * 5) + 3;
                for (let i = 0; i < len; i++) {
                    const tension = i / len;
                    const note = chord.getWeightedNote(tension);
                    const dur = (rand() * 1.0 + 0.4) * 400;
                    newPhrase.notes.push(note);
                    newPhrase.durs.push(dur);
                    pianoInst.play(60 + note + 24, 0.15, 2000);
                    await new Promise(r => setTimeout(r, dur));
                }
                phraseLibrary.push(newPhrase);
                if (phraseLibrary.length > MAX_MEMORY) phraseLibrary.shift();
            } 
            else {
                const phraseIdx = (action === "evolve") ? phraseLibrary.length - 1 : Math.floor(rand() * phraseLibrary.length);
                const phrase = phraseLibrary[phraseIdx];
                debug.innerHTML = "Chord: " + chord.name + " | " + (action === "evolve" ? "Evolving" : "Recalling") + " peak...";
                for (let i = 0; i < phrase.notes.length; i++) {
                    const resolved = chord.resolveNote(phrase.notes[i]);
                    pianoInst.play(60 + resolved + 24, 0.15, 2000);
                    await new Promise(r => setTimeout(r, phrase.durs[i]));
                }
            }

            // --- THE DESCENT ---
            if (coreNotes.length > 0) {
                // Descent from the Root to create a "loop" feel
                pianoInst.play(60 + coreNotes[0] + 12, 0.08, 2000);
                await new Promise(r => setTimeout(r, arpeggioTiming));
                pianoInst.play(chord.bass + 12, 0.05, 2000);
            }

            currentChordName = chord.getNext();
            await new Promise(r => setTimeout(r, rand() * 1000 + 500));
            improvise();
        }



        document.getElementById('playBtn').addEventListener('click', async function() {
            await initAudio();
            setSeed(document.getElementById('seedInput').value);
            isPlaying = true;
            improvise();
        });

        document.getElementById('stopBtn').addEventListener('click', function() {
            isPlaying = false;
            document.getElementById('debug').innerHTML = "Stopped.";
        });

        document.getElementById('exportBtn').addEventListener('click', function() {
            let abc = "X:1\nT:Grand Modal Improvisation\nM:4/4\nL:1/4\nK:C\n";
            abc += "Note:- Arpeggio Wave + Memory-Driven Peak";
            const blob = new Blob([abc], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "improvisation.abc";
            a.click();
        });
    </script>
</body>
</html>
