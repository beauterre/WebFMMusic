<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recursive Phrase Improviser</title>
    <style>
        body { font-family: 'Georgia', serif; background: #050508; color: #8a8aa0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; width: 80%; max-width: 800px; padding: 40px; border-radius: 40px; background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.03); }
        h1 { color: #d1d1ff; font-weight: lighter; font-style: italic; letter-spacing: 4px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input { background: rgba(0,0,0,0.5); color: #8aaaff; border: 1px solid rgba(192, 192, 255, 0.2); border-radius: 10px; padding: 10px; font-family: 'Courier New', monospace; text-align: center; }
        .status-box { margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.6); border-radius: 20px; font-family: 'Courier New', monospace; color: #8aaaff; text-align: center; font-size: 0.9em; border: 1px solid rgba(192, 192, 255, 0.1); min-height: 60px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 25px; cursor: pointer; background: transparent; border: 1px solid #d1d1ff; color: #d1d1ff; border-radius: 50px; font-family: 'Georgia', serif; transition: all 0.4s ease; }
        button:hover { background: #d1d1ff; color: #0a0a0f; }
        .secondary { border-color: #8aaaff; color: #8aaaff; }
    </style>
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/FeltPiano/FeltPiano.js"></script>
    <script src="../../general/EffectManager.js"></script>
</head>
<body>

    <div class="container">
        <h1>Recursive Improviser</h1>
        
        <div class="controls">
            <div>
                <label>Seed</label><br>
                <input type="text" id="seedInput" value="Echoes">
            </div>
            <div class="btn-group" style="align-items: end;">
                <button id="playBtn">Play</button>
                <button id="stopBtn">Stop</button>
            </div>
        </div>

        <div class="status-box" id="debug">Ready...</div>
        
        <div class="btn-group">
            <button id="exportBtn" class="secondary">Export ABC</button>
        </div>
    </div>

    <script>
        // --- Seeded Random ---
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
        }
        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
                var t = (a + b | 0) + d | 0;
                d = d + 1 | 0;
                a = b ^ b >>> 9;
                b = c + (c << 3) | 0;
                c = (c << 21 | c >>> 11);
                c = c + t | 0;
                return (t >>> 0) / 4294967296;
            }
        }

        let rand = Math.random;
        function setSeed(seed) {
            const seedData = cyrb128(seed);
            rand = sfc32(seedData[0], seedData[1], seedData[2], seedData[3]);
        }

        const WEIGHTS = {
            CORE: 1.0,
            COLOR: 0.1,
            TENSION: 0.01,
            FORBIDDEN: 0.0
        };

        class MarkovChord {
            constructor(name, bass, weights, transitions) {
                this.name = name;
                this.bass = bass;
                this.weights = weights; 
                this.transitions = transitions;
            }

            getNext() {
                const r = rand();
                let cumulative = 0;
                for (let chordName in this.transitions) {
                    cumulative += this.transitions[chordName];
                    if (r <= cumulative) return chordName;
                }
                return Object.keys(this.transitions)[0];
            }

            getWeightedNote(tensionLevel) {
                let pool = [];
                for (let i = 0; i < 12; i++) {
                    let weight = this.weights[i];
                    if (weight === WEIGHTS.TENSION) weight *= (tensionLevel * 10); 
                    if (weight === WEIGHTS.COLOR) weight *= (1 + tensionLevel);
                    for (let w = 0; w < weight * 100; w++) pool.push(i);
                }
                return pool.length > 0 ? pool[Math.floor(rand() * pool.length)] : 0;
            }

            // Find the nearest acceptable note in THIS chord's weight map
            resolveNote(originalNoteOffset) {
                let bestNote = 0;
                let minDistance = 13;
                
                for (let i = 0; i < 12; i++) {
                    if (this.weights[i] >= WEIGHTS.COLOR) { // Only resolve to Core or Color
                        let dist = Math.abs(i - originalNoteOffset);
                        if (dist > 6) dist = 12 - dist; // Circular distance
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestNote = i;
                        }
                    }
                }
                return bestNote;
            }
        }

        const CHORD_MAP = {
            "C2": new MarkovChord("C2", 48, [WEIGHTS.CORE, WEIGHTS.FORBIDDEN, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.COLOR], { "C2": 0.4, "F2": 0.4, "Am7": 0.2 }),
            "F2": new MarkovChord("F2", 41, [WEIGHTS.CORE, WEIGHTS.FORBIDDEN, WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.COLOR, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE], { "F2": 0.4, "G2": 0.4, "C2": 0.2 }),
            "G2": new MarkovChord("G2", 43, [WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE], { "G2": 0.4, "C2": 0.3, "Em7": 0.3 }),
            "Am7": new MarkovChord("Am7", 45, [WEIGHTS.CORE, WEIGHTS.FORBIDDEN, WEIGHTS.COLOR, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE], { "Am7": 0.5, "F2": 0.3, "G7sus": 0.2 }),
            "Em7": new MarkovChord("Em7", 40, [WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.COLOR, WEIGHTS.TENSION, WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.TENSION, WEIGHTS.COLOR, WEIGHTS.CORE], { "Em7": 0.4, "Am7": 0.4, "C2": 0.2 }),
            "G7sus": new MarkovChord("G7sus", 43, [WEIGHTS.COLOR, WEIGHTS.FORBIDDEN, WEIGHTS.COLOR, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE, WEIGHTS.TENSION, WEIGHTS.CORE], { "C2": 0.7, "G7sus": 0.3 }),
        };

        let audioContext, pianoInst, effectMgr;
        let isPlaying = false;
        let currentChordName = "C2";
        let phraseMemory = []; // Store {noteOffset, duration}

        async function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                effectMgr = new EffectManager(audioContext);
                pianoInst = new FeltPiano(audioContext);
                pianoInst.setVolume(1.1);
                effectMgr.setReverb(pianoInst, 'room');
            }
            if (audioContext.state === 'suspended') await audioContext.resume();
        }

        async function improvise() {
            if (!isPlaying) return;

            const debug = document.getElementById('debug');
            const chord = CHORD_MAP[currentChordName];
            
            // Decision: Create new phrase or repeat/resolve?
            const shouldRepeat = phraseMemory.length > 0 && rand() < 0.6; 
            
            pianoInst.play(chord.bass, 0.2, 4000);
            
            if (!shouldRepeat) {
                // GENERATE NEW PHRASE
                phraseMemory = [];
                const notesInPhrase = Math.floor(rand() * 6) + 4;
                for (let i = 0; i < notesInPhrase; i++) {
                    const tension = i / notesInPhrase;
                    const noteOffset = chord.getWeightedNote(tension);
                    const dur = (rand() * 1.2 + 0.4) * 400;
                    
                    phraseMemory.push({ noteOffset, dur });
                    
                    pianoInst.play(60 + noteOffset + 12, 0.15, 2000);
                    debug.innerHTML = `Generating: chord.name∣Tension:{chord.name} | Tension:chord.name∣Tension:{(tension*100).toFixed(0)}%`;
                    await new Promise(r => setTimeout(r, dur));
                }
            } else {
                // REPEAT & RESOLVE PHRASE
                debug.innerHTML = `Repeating & Resolving: ${chord.name}`;
                for (let item of phraseMemory) {
                    // Resolve the old note to the nearest valid note in the NEW chord
                    const resolvedNote = chord.resolveNote(item.noteOffset);
                    pianoInst.play(60 + resolvedNote + 12, 0.15, 2000);
                    await new Promise(r => setTimeout(r, item.dur));
                }
            }

            currentChordName = chord.getNext();
            await new Promise(r => setTimeout(r, rand() * 1000 + 500));
            improvise();
        }

        document.getElementById('playBtn').addEventListener('click', async function() {
            await initAudio();
            setSeed(document.getElementById('seedInput').value);
            isPlaying = true;
            improvise();
        });

        document.getElementById('stopBtn').addEventListener('click', function() {
            isPlaying = false;
            document.getElementById('debug').innerHTML = "Stopped.";
        });

        document.getElementById('exportBtn').addEventListener('click', function() {
            let abc = "X:1\nT:Recursive Improvisation\nM:4/4\nL:1/4\nK:C\n";
            abc += "Note:- Phrase repetition enabled";
            const blob = new Blob([abc], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "improvisation.abc";
            a.click();
        });
    </script>
</body>
</html>
