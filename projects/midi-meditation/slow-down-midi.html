<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Eternal Stretch - Variable Tempo</title>
    <style>
        body { font-family: 'Georgia', serif; background: #05050a; color: #d1d1e0; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .controls { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 30px; margin-bottom: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 80%; max-width: 800px; }
        .slider-container { margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 20px; }
        input[type=range] { width: 300px; cursor: pointer; }
        canvas { background: #000; border: 1px solid #333; border-radius: 10px; box-shadow: 0 0 50px rgba(0,0,0,1); }
        #stats { margin-top: 15px; font-family: 'Courier New', monospace; color: #a2d2ff; font-size: 0.9em; line-height: 1.6; }
        .btn { padding: 12px 30px; cursor: pointer; background: transparent; border: 1px solid #b8c0ff; color: #b8c0ff; border-radius: 50px; font-family: 'Georgia', serif; transition: 0.3s; }
        .btn:hover { background: #b8c0ff; color: #0a0a12; }
        #fileInput { display: none; }
        label { font-size: 0.9em; color: #aaa; }
    </style>
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/SereneBells/SereneBells.js"></script>
    <script src="../../general/EffectManager.js"></script>
</head>
<body>

    <div class="controls">
        <h1>Eternal Stretch</h1>
        <label for="fileInput" class="btn">Load MIDI File</label>
        <input type="file" id="fileInput" accept=".mid,.midi">
        
        <div class="slider-container">
            <label>Slower</label>
            <input type="range" id="speedSlider" min="0.01" max="1" step="0.01" value="0.25">
            <label>Faster</label>
        </div>
        
        <div id="stats">Systeem: Stand-by</div>
    </div>

    <canvas id="pianoRoll"></canvas>

    <script>
        const canvas = document.getElementById('pianoRoll');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');
        const speedSlider = document.getElementById('speedSlider');

        let audioContext, bellInst, effectMgr;
        let noteBlocks = [];
        let isPlaying = false;
        let startTime = 0;
        let currentPlayheadTick = 0;
        
        let tickRange = 0, minTick = 0;
        let averageIOI = 0; // Average Inter-Onset Interval

        async function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            effectMgr = new EffectManager(audioContext);
            bellInst = new SereneBells(audioContext);
            bellInst.setVolume(2.5);
            effectMgr.setReverb(bellInst, 'cathedral');
        }

        // --- ROBUST PARSER ---
        function parseMidi(buffer) {
            const view = new DataView(buffer);
            let pos = 0;
            const allRawEvents = [];
            if (view.byteLength < 14 || view.getUint32(0) !== 0x4D546864) return null;
            const numTracks = view.getUint16(10);
            pos = 14;
            for (let t = 0; t < numTracks; t++) {
                while (pos < view.byteLength && (view.getUint8(pos) !== 0x4D || view.getUint8(pos+1) !== 0x54)) pos++;
                if (pos >= view.byteLength - 8) break;
                pos += 4; 
                const trackLength = view.getUint32(pos);
                pos += 4;
                const trackEnd = pos + trackLength;
                let absoluteTick = 0, runningStatus = null;
                while (pos < trackEnd && pos < view.byteLength) {
                    let delta = 0;
                    while (pos < view.byteLength) {
                        let byte = view.getUint8(pos++);
                        delta = (delta << 7) | (byte & 0x7F);
                        if (!(byte & 0x80)) break;
                    }
                    absoluteTick += delta;
                    if (pos >= view.byteLength) break;
                    let status = view.getUint8(pos);
                    if (status < 0x80) status = runningStatus;
                    else { runningStatus = status; pos++; }
                    if (status === null) { pos++; continue; }
                    if ((status & 0xF0) === 0x90) { 
                        const note = view.getUint8(pos++);
                        const vel = view.getUint8(pos++);
                        if (vel > 0) allRawEvents.push({ tick: absoluteTick, type: 'on', note, vel });
                        else allRawEvents.push({ tick: absoluteTick, type: 'off', note });
                    } else if ((status & 0xF0) === 0x80) { 
                        const note = view.getUint8(pos++); pos++; 
                        allRawEvents.push({ tick: absoluteTick, type: 'off', note });
                    } else if (status === 0xFF) { 
                        pos++; let len = 0;
                        while (pos < view.byteLength) {
                            let b = view.getUint8(pos++);
                            len = (len << 7) | (b & 0x7F);
                            if (!(b & 0x80)) break;
                        }
                        pos += len;
                    } else if (status === 0xF0 || status === 0xF7) { 
                        if (status === 0xF0) { while (pos < view.byteLength && view.getUint8(pos++) !== 0xF7); } else { pos++; }
                    } else { pos += (status === 0xC0 || (status & 0xF0) === 0xD0) ? 1 : 2; }
                }
                pos = trackEnd;
            }
            return allRawEvents;
        }

        function convertToBlocks(raw) {
            const blocks = [];
            const active = {};
            raw.sort((a, b) => a.tick - b.tick);
            raw.forEach(ev => {
                const key = ev.note; 
                if (ev.type === 'on') {
                    if (active[key]) {
                        const s = active[key];
                        blocks.push({ note: s.note, start: s.tick, duration: ev.tick - s.tick, vel: s.vel });
                    }
                    active[key] = ev;
                } else if (ev.type === 'off' && active[key]) {
                    const s = active[key];
                    blocks.push({ note: s.note, start: s.tick, duration: ev.tick - s.tick, vel: s.vel });
                    delete active[key];
                }
            });
            return blocks;
        }

        function calculateAverageIOI(blocks) {
            const starts = blocks.map(b => b.start).sort((a, b) => a - b);
            let totalGap = 0;
            let count = 0;
            for (let i = 1; i < starts.length; i++) {
                const gap = starts[i] - starts[i-1];
                if (gap > 10) { // Ignore chords (gap ~ 0) and tiny jitters
                    totalGap += gap;
                    count++;
                }
            }
            return count > 0 ? totalGap / count : 0;
        }

        function draw(now) {
            if (noteBlocks.length === 0) return;
            const minNote = Math.min(...noteBlocks.map(b => b.note));
            const maxNote = Math.max(...noteBlocks.map(b => b.note));
            const noteRange = maxNote - minNote + 1;

            canvas.width = 1200;
            canvas.height = noteRange * 6 + 100;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            noteBlocks.forEach(b => {
                const x = ((b.start - minTick) / tickRange) * canvas.width;
                const w = (b.duration / tickRange) * canvas.width;
                const y = (b.note - minNote) * 6;
                const brightness = Math.floor((b.vel / 127) * 40) + 30;
                ctx.fillStyle = `hsl(210, 80%, ${brightness}%)`;
                ctx.fillRect(x, y, Math.max(w, 1), 5);
            });

            if (isPlaying) {
                const cursorX = ((currentPlayheadTick - minTick) / tickRange) * canvas.width;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cursorX, 0);
                ctx.lineTo(cursorX, canvas.height);
                ctx.stroke();
            }
        }

        function playLoop(now) {
            if (!isPlaying) return;
            
            const deltaTime = now - lastFrameTime;
            lastFrameTime = now;

            // Calculate current speed:
            // Base speed is 1.0. a value of 0.1 is very slow, 10 is very fast.
            // We'll define a "base" tick rate of 100 ticks per second at speed 1.0
            const ticksPerMs = (speedSlider.value * 100) / 1000;
            currentPlayheadTick += deltaTime * (ticksPerMs * 10); // Adjust multiplier for feel

            noteBlocks.forEach(b => {
                if (!b.played && currentPlayheadTick >= b.start) {
                    bellInst.play(b.note, 0.3, 8000);
                    b.played = true;
                }
            });

            // Calculation for the stats box
            const speed = parseFloat(speedSlider.value);
            const ticksPerSec = speed * 1000; // Arbitrary base rate
            const totalSeconds = tickRange / ticksPerSec;
            
            stats.innerHTML = "Avg Interval: "+averageIOI.toFixed(1)+" ticks<br>";
            stats.innerHTML += "Speed Multiplier: "+speed+"x<br>";
            stats.innerHTML += "Estimated Total Duration: "+Math.floor(totalSeconds)+"s ";
            stats.innerHTML += Math.floor(totalSeconds)+"s "+Math.floor(totalSeconds)+"s ";
			stats.innerHTML += "("+(totalSeconds/60).toFixed(2)+" min)<br>";
            stats.innerHTML += "Current Position: "+Math.floor(currentPlayheadTick)+" ticks";

            draw(now);

            if (currentPlayheadTick < Math.max(...noteBlocks.map(b => b.start + b.duration))) {
                requestAnimationFrame(playLoop);
            } else {
                isPlaying = false;
                stats.innerHTML = "Composition finished.";
            }
        }

        let lastFrameTime = 0;
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            await initAudio();
            const file = e.target.files[0];
            if (!file) return;
            const buffer = await file.arrayBuffer();
            const raw = parseMidi(buffer);
            if (!raw) return;

            noteBlocks = convertToBlocks(raw);
            minTick = Math.min(...noteBlocks.map(b => b.start));
            const maxTick = Math.max(...noteBlocks.map(b => b.start + b.duration));
            tickRange = maxTick - minTick;
            averageIOI = calculateAverageIOI(noteBlocks);

            noteBlocks.forEach(b => b.played = false);
            currentPlayheadTick = minTick;
            isPlaying = true;
            
            lastFrameTime = performance.now();
            requestAnimationFrame(playLoop);
        });
    </script>
</body>
</html>
