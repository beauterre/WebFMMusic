<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tonal Engine Improviser</title>
    <style>
        body { font-family: 'Georgia', serif; background: #050508; color: #8a8aa0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; width: 80%; max-width: 800px; padding: 40px; border-radius: 40px; background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.03); }
        h1 { color: #d1d1ff; font-weight: lighter; font-style: italic; letter-spacing: 4px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input { background: rgba(0,0,0,0.5); color: #8aaaff; border: 1px solid rgba(192, 192, 255, 0.2); border-radius: 10px; padding: 10px; font-family: 'Courier New', monospace; text-align: center; }
        .status-box { margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.6); border-radius: 20px; font-family: 'Courier New', monospace; color: #8aaaff; text-align: center; font-size: 0.9em; border: 1px solid rgba(192, 192, 255, 0.1); min-height: 60px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 25px; cursor: pointer; background: transparent; border: 1px solid #d1d1ff; color: #d1d1ff; border-radius: 50px; font-family: 'Georgia', serif; transition: all 0.4s ease; }
        button:hover { background: #d1d1ff; color: #0a0a0f; }
    </style>
    <script src="../../general/instrument.js"></script>
    <script src="../../instruments/harp/OrchestraHarp.js"></script>
    <script src="../../general/EffectManager.js"></script>
</head>
<body>

    <div class="container">
        <h1>Tonal Engine</h1>
        <div class="controls">
            <div><label>Seed</label><br><input type="text" id="seedInput" value="Universe"></div>
            <div class="btn-group" style="align-items: end;"><button id="playBtn">Play</button><button id="stopBtn">Stop</button></div>
        </div>
        <div class="status-box" id="debug">Awaiting tonal spark...</div>
    </div>

    <script>
        // --- Seeded Random ---
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
        }
        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
                var t = (a + b | 0) + d | 0;
                d = d + 1 | 0;
                a = b ^ b >>> 9;
                b = c + (c << 3) | 0;
                c = (c << 21 | c >>> 11);
                c = c + t | 0;
                return (t >>> 0) / 4294967296;
            }
        }

        let rand = Math.random;
        function setSeed(seed) {
            const seedData = cyrb128(seed);
            rand = sfc32(seedData[0], seedData[1], seedData[2], seedData[3]);
        }

        const WEIGHTS = { CORE: 1.0, COLOR: 0.1, TENSION: 0.01, FORBIDDEN: 0.0 };

        // --- CHORD TYPE BLUEPRINTS ---
        // Maps intervals (0-11) to weights
        const TYPE_BLUEPRINTS = {
            "Maj7": { 0: WEIGHTS.CORE, 4: WEIGHTS.CORE, 7: WEIGHTS.CORE, 11: WEIGHTS.CORE, 2: WEIGHTS.COLOR, 9: WEIGHTS.COLOR },
            "min7": { 0: WEIGHTS.CORE, 3: WEIGHTS.CORE, 7: WEIGHTS.CORE, 10: WEIGHTS.CORE, 2: WEIGHTS.COLOR, 5: WEIGHTS.COLOR },
            "Dom7": { 0: WEIGHTS.CORE, 4: WEIGHTS.CORE, 7: WEIGHTS.CORE, 10: WEIGHTS.CORE, 2: WEIGHTS.COLOR, 9: WEIGHTS.COLOR },
            "sus4": { 0: WEIGHTS.CORE, 5: WEIGHTS.CORE, 7: WEIGHTS.CORE, 10: WEIGHTS.COLOR },
            "dim7": { 0: WEIGHTS.CORE, 3: WEIGHTS.CORE, 6: WEIGHTS.CORE, 9: WEIGHTS.CORE }
        };

        class TonalState {
            constructor(root, type) {
                this.root = root; // 0-11
                this.type = type; // "Maj7", etc.
            }

            getWeights() {
                let weights = new Array(12).fill(WEIGHTS.FORBIDDEN);
                const blueprint = TYPE_BLUEPRINTS[this.type];
                for (let interval in blueprint) {
                    let note = (parseInt(interval) + this.root) % 12;
                    weights[note] = blueprint[interval];
                }
                return weights;
            }

            getCoreNotes() {
                const weights = this.getWeights();
                let core = [];
                for (let i = 0; i < 12; i++) {
                    if (weights[i] === WEIGHTS.CORE) core.push(i);
                }
                // Sort relative to the root
                return core.sort((a, b) => (a - this.root + 12) % 12 - (b - this.root + 12) % 12);
            }

            getWeightedNote(tensionLevel) {
                const weights = this.getWeights();
                let pool = [];
                for (let i = 0; i < 12; i++) {
                    let weight = weights[i];
                    if (weight === WEIGHTS.TENSION) weight *= (tensionLevel * 10); 
                    if (weight === WEIGHTS.COLOR) weight *= (1 + tensionLevel);
                    for (let w = 0; w < weight * 100; w++) pool.push(i);
                }
                return pool.length > 0 ? pool[Math.floor(rand() * pool.length)] : this.root;
            }

            resolveNote(originalNote) {
                const weights = this.getWeights();
                let bestNote = this.root;
                let minDistance = 13;
                for (let i = 0; i < 12; i++) {
                    if (weights[i] >= WEIGHTS.COLOR) {
                        let dist = Math.abs(i - originalNote);
                        if (dist > 6) dist = 12 - dist;
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestNote = i;
                        }
                    }
                }
                return bestNote;
            }

            getNextState() {
                const r = rand();
                let nextRoot = this.root;
                let nextType = this.type;

                // 1. Root Movement (The Interval Markov)
                if (r < 0.4) nextRoot = (this.root + 7) % 12; // Move by 5th (Strong)
                else if (r < 0.7) nextRoot = (this.root + 5) % 12; // Move by 4th (Strong)
                else if (r < 0.85) nextRoot = (this.root + (rand() < 0.5 ? 3 : -3)) % 12; // Mediant shift
                else nextRoot = (this.root + (rand() < 0.5 ? 1 : -1)) % 12; // Chromatic slide

                // 2. Type Movement
                const types = Object.keys(TYPE_BLUEPRINTS);
                if (rand() < 0.3) {
                    nextType = types[Math.floor(rand() * types.length)];
                }

                return new TonalState(nextRoot, nextType);
            }
        }

        let audioContext, pianoInst, effectMgr;
        let isPlaying = false;
        let state = new TonalState(0, "Maj7"); // Start at C Maj7
        let phraseLibrary = []; 
        const MAX_MEMORY = 5;

        async function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                effectMgr = new EffectManager(audioContext);
                pianoInst = new OrchestraHarp(audioContext);
                pianoInst.setVolume(1.1);
                effectMgr.setReverb(pianoInst, 'cathedral');
            }
            if (audioContext.state === 'suspended') await audioContext.resume();
        }

        async function improvise() {
            if (!isPlaying) return;

            const debug = document.getElementById('debug');
            const coreNotes = state.getCoreNotes();
            const arpeggioTiming = 300;
            
            // Dynamic Bass: Root (48 is C)
            const bassNote = 48 + state.root;
            debug.innerHTML = "Tonal Center: " + state.root + " | Type: " + state.type;

            // --- ASCENT ---
            pianoInst.play(bassNote, 0.2, 4000);
            await new Promise(r => setTimeout(r, arpeggioTiming));
            pianoInst.play(bassNote + 12, 0.15, 3000);
            await new Promise(r => setTimeout(r, arpeggioTiming));
            
            if (coreNotes.length >= 3) {
                pianoInst.play(60 + coreNotes[2] + 12, 0.1, 3000);
                await new Promise(r => setTimeout(r, arpeggioTiming));
            }
            if (coreNotes.length >= 4) {
                pianoInst.play(60 + coreNotes[3] + 12, 0.1, 2000);
                await new Promise(r => setTimeout(r, arpeggioTiming * 0.8));
                pianoInst.play(60 + coreNotes[1] + 12, 0.1, 2000);
                await new Promise(r => setTimeout(r, arpeggioTiming * 0.8));
            }

            // --- PEAK ---
            const actionRoll = rand();
            let action = (actionRoll < 0.15) ? "silence" : (actionRoll < 0.45 && phraseLibrary.length > 0) ? "recall" : (actionRoll < 0.70 && phraseLibrary.length > 0) ? "evolve" : "innovate";

            if (action === "silence") {
                await new Promise(r => setTimeout(r, 1500));
            } else if (action === "innovate") {
                let newPhrase = { notes: [], durs: [] };
                const len = Math.floor(rand() * 5) + 3;
                for (let i = 0; i < len; i++) {
                    const note = state.getWeightedNote(i / len);
                    const dur = (rand() * 1.0 + 0.4) * 400;
                    newPhrase.notes.push(note);
                    newPhrase.durs.push(dur);
                    pianoInst.play(60 + note + 24, 0.15, 2000);
                    await new Promise(r => setTimeout(r, dur));
                }
                phraseLibrary.push(newPhrase);
                if (phraseLibrary.length > MAX_MEMORY) phraseLibrary.shift();
            } else {
                const phrase = (action === "evolve") ? phraseLibrary[phraseLibrary.length - 1] : phraseLibrary[Math.floor(rand() * phraseLibrary.length)];
                for (let i = 0; i < phrase.notes.length; i++) {
                    const resolved = state.resolveNote(phrase.notes[i]);
                    pianoInst.play(60 + resolved + 24, 0.15, 2000);
                    await new Promise(r => setTimeout(r, phrase.durs[i]));
                }
            }

            // --- DESCENT ---
            if (coreNotes.length > 0) {
                pianoInst.play(60 + coreNotes[0] + 12, 0.08, 2000);
                await new Promise(r => setTimeout(r, arpeggioTiming));
                pianoInst.play(bassNote + 12, 0.05, 2000);
            }

            state = state.getNextState();
            await new Promise(r => setTimeout(r, rand() * 1000 + 500));
            improvise();
        }

        document.getElementById('playBtn').addEventListener('click', async function() {
            await initAudio();
            setSeed(document.getElementById('seedInput').value);
            isPlaying = true;
            improvise();
        });

        document.getElementById('stopBtn').addEventListener('click', function() {
            isPlaying = false;
            document.getElementById('debug').innerHTML = "Stopped.";
        });
    </script>
</body>
</html>
